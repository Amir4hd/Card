<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Amrellah T. | Digital Business Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #eef2f7;
      font-family: 'Inter', sans-serif;
      padding: 20px 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-wrapper {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      position: relative;
    }

    /* scrollable content */
    .card-scroll {
      background: white;
      border-radius: 36px;
      overflow-y: auto;
      max-height: 78vh;
      scroll-behavior: smooth;
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.12);
    }

    .card-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .card-scroll::-webkit-scrollbar-track {
      background: #e9ecef;
      border-radius: 10px;
    }
    .card-scroll::-webkit-scrollbar-thumb {
      background: #c0a06b;
      border-radius: 10px;
    }

    .card-content {
      padding: 28px 24px 20px 24px;
    }

    /* header area - cleaner */
    .name-row {
      margin-bottom: 24px;
      border-bottom: 1px solid #f0f2f5;
      padding-bottom: 20px;
    }
    .name-row h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #1a2c3e;
      margin-bottom: 6px;
    }
    .title-badge {
      display: inline-block;
      background: #f5ede2;
      color: #b8925c;
      font-size: 13px;
      font-weight: 500;
      padding: 4px 14px;
      border-radius: 30px;
      margin-top: 6px;
    }
    .company-text {
      color: #5f6c80;
      font-size: 14px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .company-text i {
      color: #b8925c;
      font-size: 13px;
    }

    /* section headers - minimal */
    .section-header {
      font-size: 15px;
      font-weight: 600;
      color: #3a4a62;
      margin: 24px 0 14px 0;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-header i {
      color: #b8925c;
      font-size: 14px;
    }

    /* button row - clean */
    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .action-btn {
      flex: 1;
      background: #f8f9fc;
      border-radius: 50px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      color: #2c3e50;
      border: 1px solid #eef2f8;
      transition: all 0.2s ease;
    }
    .action-btn i {
      font-size: 18px;
    }
    .action-btn:hover {
      background: white;
      border-color: #c0a06b;
      transform: translateY(-2px);
    }

    /* contact cards - airy */
    .contact-block {
      background: #fafbfd;
      border-radius: 24px;
      padding: 16px 18px;
      margin: 12px 0 8px;
    }
    .contact-line {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 16px;
    }
    .contact-line:last-child {
      margin-bottom: 0;
    }
    .contact-icon {
      width: 32px;
      color: #b8925c;
      font-size: 16px;
      text-align: center;
      margin-top: 2px;
    }
    .contact-info {
      flex: 1;
    }
    .contact-info a {
      text-decoration: none;
      color: #2c3e50;
      font-size: 14px;
      font-weight: 500;
      display: inline-block;
      margin-right: 12px;
      margin-bottom: 4px;
    }
    .contact-info a:hover {
      color: #b8925c;
    }
    .contact-label {
      font-size: 11px;
      color: #8a99b0;
      letter-spacing: 0.2px;
    }
    .small-note {
      font-size: 12px;
      color: #6c7a91;
      margin-top: 4px;
    }

    /* location chip */
    .location-chip {
      background: #f4f6fa;
      border-radius: 40px;
      padding: 10px 18px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #2c5a7a;
      font-size: 13px;
      font-weight: 500;
      margin-top: 8px;
      width: auto;
      transition: 0.2s;
    }
    .location-chip i {
      font-size: 14px;
      color: #b35f2b;
    }

    /* qr - subtle */
    .qr-wrapper {
      background: #ffffff;
      border-radius: 24px;
      margin: 24px 0 16px;
      text-align: center;
      padding: 12px;
      border: 1px solid #edf2f7;
    }
    #qrcode-container {
      display: flex;
      justify-content: center;
    }
    #qrcode-container img, #qrcode-container canvas {
      width: 100px;
      height: 100px;
      border-radius: 16px;
    }
    .qr-caption {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 8px;
    }

    /* fixed import button */
    .fixed-footer {
      position: sticky;
      bottom: 0;
      width: 100%;
      padding: 0 0 16px 0;
      margin-top: -8px;
      z-index: 10;
    }
    .import-btn {
      background: #1f2e3a;
      border-radius: 60px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 88%;
      margin: 0 auto;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: white;
      box-shadow: 0 12px 25px -10px rgba(0,0,0,0.25);
      transition: all 0.2s;
    }
    .import-btn i {
      font-size: 16px;
    }
    .import-btn:hover {
      background: #b8925c;
      color: #1a2c3e;
      transform: scale(1.01);
    }

    hr {
      margin: 16px 0;
      border: none;
      border-top: 1px solid #edf2f8;
    }

    .footer-note {
      text-align: center;
      font-size: 10px;
      color: #9aa9bf;
      margin-top: 16px;
      letter-spacing: 0.2px;
    }

    @media (max-width: 450px) {
      .card-content {
        padding: 22px 18px 16px;
      }
      .action-btn {
        padding: 9px 8px;
        font-size: 12px;
      }
      .contact-block {
        padding: 14px 14px;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="card-wrapper">
  <div class="card-scroll">
    <div class="card-content">
      
      <!-- profile: name, title, company (clean spacing) -->
      <div class="name-row">
        <h1>Amrellah T.</h1>
        <div class="title-badge">Plant Manager</div>
        <div class="company-text">
          <i class="fas fa-building"></i> Twingulf Industries
        </div>
      </div>

      <!-- 01 direct connect: WhatsApp & Telegram -->
      <div class="section-header">
        <i class="fab fa-whatsapp"></i> Connect instantly
      </div>
      <div class="button-row">
        <a href="https://wa.me/25377481141?text=Hello%20Amrellah%2C%20I%20saw%20your%20card" target="_blank" class="action-btn">
          <i class="fab fa-whatsapp"></i> WhatsApp
        </a>
        <a href="https://t.me/Mramir_58" target="_blank" class="action-btn">
          <i class="fab fa-telegram-plane"></i> Telegram
        </a>
      </div>

      <!-- location button (clean map) -->
      <div style="margin: 6px 0 4px;">
        <a href="https://maps.app.goo.gl/bb3PMKVXuge5qbs39" target="_blank" class="location-chip">
          <i class="fas fa-map-pin"></i> Twingulf Industries, Djibouti City
        </a>
      </div>

      <!-- 02 contact details (phones, emails, web) -->
      <div class="section-header">
        <i class="far fa-address-card"></i> Contact
      </div>
      <div class="contact-block">
        <!-- phones -->
        <div class="contact-line">
          <div class="contact-icon"><i class="fas fa-phone"></i></div>
          <div class="contact-info">
            <a href="tel:+25377481141">+253 77 481 141</a> <span class="contact-label">primary</span><br>
            <a href="tel:+251923139300">+251 923 139 300</a> <span class="contact-label">secondary</span>
          </div>
        </div>
        <!-- emails -->
        <div class="contact-line">
          <div class="contact-icon"><i class="far fa-envelope"></i></div>
          <div class="contact-info">
            <a href="mailto:amrallah.tawfik@twin-gulf.com">amrallah.tawfik@twin-gulf.com</a><br>
            <a href="mailto:amirtewfik1516@gmail.com">amirtewfik1516@gmail.com</a>
          </div>
        </div>
        <!-- website -->
        <div class="contact-line">
          <div class="contact-icon"><i class="fas fa-globe"></i></div>
          <div class="contact-info">
            <a href="https://www.twin-gulf.com" target="_blank">www.twin-gulf.com</a>
          </div>
        </div>
      </div>

      <!-- QR code area: smaller & clean -->
      <div class="qr-wrapper">
        <div id="qrcode-container"></div>
        <div class="qr-caption">
          <i class="fas fa-qrcode"></i> Scan to view digital card
        </div>
      </div>

      <div class="footer-note">
        <i class="far fa-id-card"></i> digital business card
      </div>
      <!-- extra space before sticky button -->
      <div style="height: 20px;"></div>
    </div>
  </div>

  <!-- fixed IMPORT button (sticky bottom) -->
  <div class="fixed-footer">
    <button class="import-btn" id="saveVcardBtn">
      <i class="fas fa-download"></i> IMPORT CONTACT (vCard)
      <i class="fas fa-arrow-down"></i>
    </button>
  </div>
</div>

<script>
  (function() {
    // generate QR code pointing to current page / digital card
    let qrTarget = window.location.href;
    if (!qrTarget || qrTarget === "" || qrTarget.indexOf("file://") === 0) {
      qrTarget = "https://amrellah-t.digitalcard.pro";
    }
    const qrContainer = document.getElementById("qrcode-container");
    if (qrContainer) {
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, {
        text: qrTarget,
        width: 100,
        height: 100,
        colorDark: "#1f2e3a",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    // create vCard file with all details
    function buildVCard() {
      const firstName = "Amrellah";
      const lastName = "Tawfik";
      const fullName = "Amrellah T.";
      const org = "Twingulf Industries";
      const title = "Plant Manager";
      const phone1 = "+25377481141";
      const phone2 = "+251923139300";
      const emailWork = "amrallah.tawfik@twin-gulf.com";
      const emailPersonal = "amirtewfik1516@gmail.com";
      const website = "https://www.twin-gulf.com";
      const address = "Twingulf Industries, Djibouti City, Djibouti";
      const mapLink = "https://maps.app.goo.gl/bb3PMKVXuge5qbs39";
      const whatsappLink = "https://wa.me/25377481141";
      const telegramLink = "https://t.me/Mramir_58";

      let vcard = "BEGIN:VCARD\r\n";
      vcard += "VERSION:3.0\r\n";
      vcard += `FN:${fullName}\r\n`;
      vcard += `N:${lastName};${firstName};;;\r\n`;
      vcard += `ORG:${org}\r\n`;
      vcard += `TITLE:${title}\r\n`;
      vcard += `TEL;TYPE=WORK,VOICE:${phone1}\r\n`;
      vcard += `TEL;TYPE=CELL,VOICE:${phone2}\r\n`;
      vcard += `EMAIL;TYPE=WORK:${emailWork}\r\n`;
      vcard += `EMAIL;TYPE=HOME:${emailPersonal}\r\n`;
      vcard += `URL;TYPE=WORK:${website}\r\n`;
      vcard += `ADR;TYPE=WORK:;;${address};;;Djibouti\r\n`;
      vcard += `NOTE:WhatsApp: ${whatsappLink} | Telegram: ${telegramLink} | Maps: ${mapLink}\r\n`;
      vcard += "REV:20260409T100000Z\r\n";
      vcard += "END:VCARD\r\n";
      return vcard;
    }

    // attach download event to fixed button
    const saveBtn = document.getElementById("saveVcardBtn");
    if (saveBtn) {
      saveBtn.addEventListener("click", (e) => {
        const vcardData = buildVCard();
        const blob = new Blob([vcardData], { type: "text/vcard;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const downloadLink = document.createElement("a");
        downloadLink.href = url;
        downloadLink.download = "Amrellah_Twingulf.vcf";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        URL.revokeObjectURL(url);
        
        // feedback
        const originalHtml = saveBtn.innerHTML;
        saveBtn.innerHTML = '<i class="fas fa-check"></i> Saved!';
        setTimeout(() => {
          saveBtn.innerHTML = originalHtml;
        }, 1800);
      });
    }

    // ensure location button uses exact map link
    const locationChip = document.querySelector('.location-chip');
    if (locationChip && locationChip.getAttribute('href') !== "https://maps.app.goo.gl/bb3PMKVXuge5qbs39") {
      locationChip.setAttribute("href", "https://maps.app.goo.gl/bb3PMKVXuge5qbs39");
    }
    // verify telegram link consistency
    const tgAction = document.querySelector('.action-btn[href*="t.me"]');
    if (tgAction && tgAction.getAttribute('href') !== "https://t.me/Mramir_58") {
      tgAction.setAttribute("href", "https://t.me/Mramir_58");
    }
    // whatsapp number check
    const waAction = document.querySelector('.action-btn[href*="wa.me"]');
    if (waAction && waAction.getAttribute('href') !== "https://wa.me/25377481141?text=Hello%20Amrellah%2C%20I%20saw%20your%20card") {
      waAction.setAttribute("href", "https://wa.me/25377481141?text=Hello%20Amrellah%2C%20I%20saw%20your%20card");
    }
  })();
</script>
</body>
</html>
