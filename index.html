<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a2744">
<title>Amrellah T. — Twingulf Industries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:     #1a2744;
    --navy2:    #1f3057;
    --gold:     #C9922A;
    --gold2:    #e0a83a;
    --orange:   #E07B2A;
    --white:    #FFFFFF;
    --offwhite: #F0F2F8;
    --muted:    #8a9bbf;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--navy);
    color: var(--white);
    font-family: 'Open Sans', sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 30px 20px;
    background-image:
      radial-gradient(ellipse at 90% 10%, rgba(224,123,42,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 10% 90%, rgba(201,146,42,0.06) 0%, transparent 50%);
  }
  .wrapper { width:100%; max-width:400px; display:flex; flex-direction:column; gap:16px; animation:fadeUp 0.5s ease both; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }

  .card {
    width:100%; background:var(--navy2); border-radius:16px; overflow:hidden;
    position:relative; box-shadow:0 24px 64px rgba(0,0,0,0.5);
    border:1px solid rgba(201,146,42,0.2);
  }
  .card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--orange), var(--gold), var(--orange));
  }
  .card-accent {
    position:absolute; top:-50px; right:-50px;
    width:180px; height:180px; border-radius:50%;
    border:32px solid var(--gold); opacity:0.08; pointer-events:none;
  }
  .card-header {
    padding:28px 28px 20px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    border-bottom:1px solid rgba(255,255,255,0.07); position:relative;
  }
  .header-left { flex:1; }
  .name { font-family:'Montserrat',sans-serif; font-size:22px; font-weight:700; color:var(--white); letter-spacing:1px; text-transform:uppercase; line-height:1.1; }
  .name-underline { width:36px; height:2px; background:linear-gradient(90deg,var(--gold),var(--orange)); margin:7px 0 8px; border-radius:2px; }
  .job-title { font-family:'Montserrat',sans-serif; font-size:10px; font-weight:500; color:var(--gold2); letter-spacing:1.5px; text-transform:uppercase; }

  .logo-block { display:flex; flex-direction:column; align-items:center; gap:5px; flex-shrink:0; }
  .logo-img { width:52px; height:52px; object-fit:contain; border-radius:4px; }
  .logo-text { font-family:'Montserrat',sans-serif; font-size:7.5px; font-weight:700; color:var(--white); letter-spacing:1px; text-align:center; text-transform:uppercase; line-height:1.4; }

  .card-body { padding:18px 28px 26px; display:flex; flex-direction:column; gap:11px; }
  .info-row { display:flex; align-items:flex-start; gap:12px; }
  .icon {
    width:30px; height:30px; border-radius:50%;
    background:rgba(201,146,42,0.1); border:1px solid rgba(201,146,42,0.25);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;
  }
  .icon svg { width:13px; height:13px; stroke:var(--gold2); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .info-content { flex:1; }
  .info-label { font-size:9px; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; font-weight:500; margin-bottom:2px; }
  .info-value { font-size:12.5px; color:var(--offwhite); font-weight:300; line-height:1.7; }
  .info-value a { color:var(--offwhite); text-decoration:none; display:block; transition:color 0.2s; }
  .info-value a:hover { color:var(--gold2); }
  .divider { height:1px; background:rgba(255,255,255,0.06); }

  .save-btn {
    width:100%; padding:14px;
    background:linear-gradient(135deg, var(--gold), var(--orange));
    border:none; border-radius:12px; color:var(--white);
    font-family:'Montserrat',sans-serif; font-size:12px; font-weight:700;
    letter-spacing:1.5px; text-transform:uppercase; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:all 0.25s; text-decoration:none;
    box-shadow:0 4px 20px rgba(224,123,42,0.35);
    animation:fadeUp 0.5s 0.15s ease both;
  }
  .save-btn:hover { transform:translateY(-2px); box-shadow:0 8px 28px rgba(224,123,42,0.5); }
  .save-btn svg { width:15px; height:15px; stroke:white; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .footer { text-align:center; font-size:10px; color:rgba(255,255,255,0.15); letter-spacing:1px; font-family:'Montserrat',sans-serif; text-transform:uppercase; animation:fadeUp 0.5s 0.25s ease both; }
  #loading { color:var(--muted); font-size:13px; padding:60px; text-align:center; }
</style>
</head>

async function loadContact() {
  const wrapper = document.querySelector('.wrapper');
  let c;
  try {
    const res = await fetch('./contact.json?v=' + Date.now());
    c = await res.json();
  } catch(e) {
    wrapper.innerHTML = '<p style="color:#8a9bbf;text-align:center;padding:40px">Could not load contact.</p>';
    return;
  }

  const phonesHTML = c.phones.map(p => `<a href="tel:${p.replace(/\s/g,'')}">${p}</a>`).join('');
  const emailsHTML = c.emails.map(e => `<a href="mailto:${e}">${e}</a>`).join('');

  const vcf = ['BEGIN:VCARD','VERSION:3.0',
    `FN:${c.name}`,`TITLE:${c.title}`,`ORG:${c.company}`,
    ...c.phones.map(p=>`TEL;TYPE=CELL:${p.replace(/\s/g,'')}`),
    ...c.emails.map((e,i)=>`EMAIL;TYPE=${i===0?'WORK':'HOME'}:${e}`),
    `URL:${c.website}`,
    `ADR;TYPE=WORK:;;${c.company};${c.location.label};;;`,
    `GEO:geo:${c.location.geo}`,
    'END:VCARD'].join('\r\n');

  wrapper.innerHTML = `
    <div class="card">
      <div class="card-accent"></div>
      <div class="card-header">
        <div class="header-left">
          <div class="name">${c.name}</div>
          <div class="name-underline"></div>
          <div class="job-title">${c.title}</div>
        </div>
        <div class="logo-block">
          <img class="logo-img" src="${LOGO_B64}" alt="Twingulf Logo"/>
          <div class="logo-text">TWINGULF<br>INDUSTRIES</div>
        </div>
      </div>
      <div class="card-body">
        <div class="info-row">
          <div class="icon"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8a19.79 19.79 0 01-3.07-8.7A2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg></div>
          <div class="info-content"><div class="info-label">Phone</div><div class="info-value">${phonesHTML}</div></div>
        </div>
        <div class="divider"></div>
        <div class="info-row">
          <div class="icon"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
          <div class="info-content"><div class="info-label">Email</div><div class="info-value">${emailsHTML}</div></div>
        </div>
        <div class="divider"></div>
        <div class="info-row">
          <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg></div>
          <div class="info-content"><div class="info-label">Website</div><div class="info-value"><a href="${c.website}" target="_blank">${c.website.replace('https://','')}</a></div></div>
        </div>
        <div class="divider"></div>
        <div class="info-row">
          <div class="icon"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
          <div class="info-content"><div class="info-label">Location</div><div class="info-value"><a href="${c.location.maps_url}" target="_blank">${c.location.label} →</a></div></div>
        </div>
      </div>
    </div>
    <a class="save-btn" id="saveBtn" href="#">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Save Contact to Phone
    </a>
    <div class="footer">Twingulf Industries · Digital Card</div>
  `;

  document.title = `${c.name} — ${c.company}`;
  document.getElementById('saveBtn').addEventListener('click', function(e) {
    e.preventDefault();
    const blob = new Blob([vcf], {type:'text/vcard'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='amrellah_tawfik.vcf'; a.click();
    URL.revokeObjectURL(url);
  });
}
loadContact();
</script>
