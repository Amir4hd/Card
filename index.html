<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0D0D0D">
<title>Amrellah T. — Digital Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #E8C97A;
    --dark: #0D0D0D;
    --dark2: #161616;
    --text: #F0EDE6;
    --muted: #8A8476;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background-image: radial-gradient(ellipse at 20% 20%, #1a1508 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 80%, #0a0d12 0%, transparent 50%);
  }
  .wrapper { display: flex; flex-direction: column; align-items: center; gap: 20px; max-width: 420px; width: 100%; }

  .card {
    width: 100%; background: var(--dark2);
    border: 1px solid #2a2820; border-radius: 20px; overflow: hidden;
    position: relative;
    box-shadow: 0 32px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(201,168,76,0.12);
    animation: fadeUp 0.5s ease both;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .card-header {
    padding: 32px 32px 20px; border-bottom: 1px solid #222;
    display: flex; align-items: flex-start; gap: 18px;
  }
  .avatar {
    width: 60px; height: 60px; border-radius: 50%;
    background: linear-gradient(135deg, #2a2410, #3d3318);
    border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; font-weight: 600; color: var(--gold);
    flex-shrink: 0; letter-spacing: 1px;
  }
  .name-block { flex: 1; }
  .name { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 600; line-height: 1.1; }
  .job-title { margin-top: 5px; font-size: 11px; font-weight: 500; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; }
  .company { margin-top: 2px; font-size: 12px; color: var(--muted); font-weight: 300; }

  .card-body { padding: 20px 32px 28px; display: flex; flex-direction: column; gap: 12px; }
  .info-row { display: flex; align-items: flex-start; gap: 12px; }
  .icon {
    width: 32px; height: 32px; border-radius: 8px;
    background: #1e1c14; border: 1px solid #2e2b1e;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .icon svg { width: 14px; height: 14px; stroke: var(--gold); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .info-content { flex: 1; }
  .info-label { font-size: 9px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; margin-bottom: 2px; }
  .info-value { font-size: 13px; color: var(--text); font-weight: 300; line-height: 1.7; }
  .info-value a { color: var(--text); text-decoration: none; transition: color 0.2s; display: block; }
  .info-value a:hover { color: var(--gold-light); }
  .divider { height: 1px; background: linear-gradient(90deg, transparent, #2a2820, transparent); margin: 2px 0; }

  .save-btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, #2a2410, #3d3318);
    border: 1px solid var(--gold); border-radius: 12px;
    color: var(--gold); font-family: 'DM Sans', sans-serif;
    font-size: 14px; font-weight: 500; letter-spacing: 0.5px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.25s; text-decoration: none;
    animation: fadeUp 0.5s 0.15s ease both;
  }
  .save-btn:hover { background: linear-gradient(135deg, #3d3318, #5a4a20); box-shadow: 0 4px 20px rgba(201,168,76,0.25); transform: translateY(-1px); }
  .save-btn svg { width: 16px; height: 16px; stroke: var(--gold); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .footer { font-size: 10px; color: #2a2820; letter-spacing: 0.5px; text-align: center; }
  #loading { color: var(--muted); font-size: 13px; padding: 40px; text-align: center; }
</style>
</head>
<body>
<div class="wrapper">
  <div id="loading">Loading contact...</div>
</div>

<script>
async function loadContact() {
  const wrapper = document.querySelector('.wrapper');

  // Load contact.json from same directory
  let c;
  try {
    const res = await fetch('./contact.json?v=' + Date.now());
    c = await res.json();
  } catch(e) {
    wrapper.innerHTML = '<p style="color:#888;text-align:center;padding:40px">Could not load contact data.</p>';
    return;
  }

  // Build initials
  const initials = c.name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();

  // Build phones HTML
  const phonesHTML = c.phones.map(p =>
    `<a href="tel:${p.replace(/\s/g,'')}">${p}</a>`
  ).join('');

  // Build emails HTML
  const emailsHTML = c.emails.map(e =>
    `<a href="mailto:${e}">${e}</a>`
  ).join('');

  // Build VCard
  const vcf = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    `FN:${c.name}`,
    `TITLE:${c.title}`,
    `ORG:${c.company}`,
    ...c.phones.map(p => `TEL;TYPE=CELL:${p.replace(/\s/g,'')}`),
    ...c.emails.map((e,i) => `EMAIL;TYPE=${i===0?'WORK':'HOME'}:${e}`),
    `URL:${c.website}`,
    `ADR;TYPE=WORK:;;${c.company};${c.location.label};;;`,
    `GEO:geo:${c.location.geo}`,
    'END:VCARD'
  ].join('\r\n');

  wrapper.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="avatar">${initials}</div>
        <div class="name-block">
          <div class="name">${c.name}</div>
          <div class="job-title">${c.title}</div>
          <div class="company">${c.company}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="info-row">
          <div class="icon"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8a19.79 19.79 0 01-3.07-8.7A2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg></div>
          <div class="info-content">
            <div class="info-label">Phone</div>
            <div class="info-value">${phonesHTML}</div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="info-row">
          <div class="icon"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
          <div class="info-content">
            <div class="info-label">Email</div>
            <div class="info-value">${emailsHTML}</div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="info-row">
          <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg></div>
          <div class="info-content">
            <div class="info-label">Website</div>
            <div class="info-value"><a href="${c.website}" target="_blank">${c.website.replace('https://','')}</a></div>
          </div>
        </div>
        <div class="divider"></div>
        <div class="info-row">
          <div class="icon"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
          <div class="info-content">
            <div class="info-label">Location</div>
            <div class="info-value"><a href="${c.location.maps_url}" target="_blank">${c.location.label} →</a></div>
          </div>
        </div>
      </div>
    </div>
    <a class="save-btn" id="saveBtn" href="#">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Save Contact to Phone
    </a>
    <div class="footer">${c.company} · digital card</div>
  `;

  document.getElementById('saveBtn').addEventListener('click', function(e) {
    e.preventDefault();
    const blob = new Blob([vcf], { type: 'text/vcard' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'amrellah_tawfik.vcf';
    a.click();
    URL.revokeObjectURL(url);
  });

  // Update page title
  document.title = `${c.name} — ${c.company}`;
}

loadContact();
</script>
</body>
</html>
