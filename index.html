<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amrellah T.</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #0B1426;
  --card: #111C36;
  --gold: #D4A937;
  --text: #EDEFF5;
  --muted: #8FA1C7;
}

/* RESET */
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body {
  background: var(--bg);
  font-family: 'Inter', sans-serif;
  color: var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

/* WRAPPER */
.container {
  width:100%;
  max-width:420px;
  padding:20px;
}

/* MAIN CARD */
.card {
  background: var(--card);
  border-radius:20px;
  padding:28px 24px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  border: 1px solid rgba(212,169,55,0.15);
  backdrop-filter: blur(10px);
}

/* NAME */
.name {
  font-family: 'Montserrat', sans-serif;
  font-size:22px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.title {
  font-size:12px;
  color: var(--gold);
  letter-spacing:2px;
  margin-top:6px;
}

.company {
  font-size:13px;
  color: var(--muted);
  margin-top:4px;
}

/* GOLD LINE */
.line {
  height:2px;
  margin:18px 0 22px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

/* BUTTONS */
.section {
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* BUTTON STYLE */
.btn {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  border-radius:14px;
  text-decoration:none;
  color:var(--text);

  background: rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.08);

  transition: all 0.25s ease;
}

/* CLICKABLE FEEL */
.btn:hover {
  transform: translateY(-2px);
  border-color: var(--gold);
  box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}

.btn:active {
  transform: scale(0.96);
}

/* LEFT TEXT */
.btn-text {
  display:flex;
  flex-direction:column;
}

.label {
  font-size:10px;
  color:var(--muted);
  letter-spacing:1.5px;
  text-transform:uppercase;
}

.value {
  font-size:14px;
  margin-top:2px;
}

/* ARROW */
.arrow {
  font-size:16px;
  color: var(--gold);
  opacity:0.7;
}

/* SAVE BUTTON */
.save {
  margin-top:18px;
  text-align:center;
  padding:15px;
  border-radius:14px;
  font-family:'Montserrat';
  font-weight:600;
  letter-spacing:1.5px;
  text-transform:uppercase;
  text-decoration:none;
  color:white;

  background: linear-gradient(135deg, #D4A937, #b8922c);

  transition: all 0.25s ease;
}

.save:hover {
  transform: translateY(-2px);
}

.save:active {
  transform: scale(0.95);
}

</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="name">Amrellah T.</div>
    <div class="title">Factory Manager</div>
    <div class="company">Twingulf Industries</div>

    <div class="line"></div>

    <div class="section">

      <a href="tel:+25377481141" class="btn">
        <div class="btn-text">
          <div class="label">Phone</div>
          <div class="value">+253 77 48 11 41</div>
        </div>
        <div class="arrow">›</div>
      </a>

      <a href="mailto:amirtewfik1516@gmail.com" class="btn">
        <div class="btn-text">
          <div class="label">Email</div>
          <div class="value">amirtewfik1516@gmail.com</div>
        </div>
        <div class="arrow">›</div>
      </a>

      <a href="https://yourwebsite.com" class="btn">
        <div class="btn-text">
          <div class="label">Website</div>
          <div class="value">www.yourwebsite.com</div>
        </div>
        <div class="arrow">›</div>
      </a>

      <a href="https://maps.google.com" class="btn">
        <div class="btn-text">
          <div class="label">Location</div>
          <div class="value">Open in Maps</div>
        </div>
        <div class="arrow">›</div>
      </a>

    </div>

    <a href="#" class="save">Save Contact</a>

  </div>
</div>

</body>
</html>
