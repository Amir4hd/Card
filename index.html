/* ── 3 COLORS ONLY: #030810 (black), #00e5ff (cyan), #ffffff (white) ── */
:root{
  --bg:     #030810;
  --bg2:    #070f1e;
  --bg3:    #0b1628;
  --cyan:   #00e5ff;
  --cyan2:  #00b8d4;
  --white:  #ffffff;
  --silver: #7a8fa8;
  --dim:    #111e30;
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
  background:var(--bg);
  color:var(--white);
  font-family:'Outfit',sans-serif;
  min-height:100vh;
  display:flex; align-items:flex-start; justify-content:center;
  padding:0 0 100px;
  overflow-x:hidden;
}

/* subtle radial glow only */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 80% 0%, rgba(0,229,255,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 10% 100%, rgba(0,229,255,0.04) 0%, transparent 60%);
}

.page{
  width:100%; max-width:440px;
  position:relative; z-index:1;
  display:flex; flex-direction:column;
  gap:0;
}

/* stagger */
.page > *{ animation:rise 0.6s cubic-bezier(0.16,1,0.3,1) both; }
.page > *:nth-child(1){animation-delay:0.04s;}
.page > *:nth-child(2){animation-delay:0.10s;}
.page > *:nth-child(3){animation-delay:0.16s;}
.page > *:nth-child(4){animation-delay:0.22s;}
.page > *:nth-child(5){animation-delay:0.28s;}
.page > *:nth-child(6){animation-delay:0.34s;}
.page > *:nth-child(7){animation-delay:0.40s;}
.page > *:nth-child(8){animation-delay:0.46s;}
.page > *:nth-child(9){animation-delay:0.52s;}

@keyframes rise{
  from{opacity:0;transform:translateY(24px);}
  to{opacity:1;transform:translateY(0);}
}

/* ══════════════════
   HERO
══════════════════ */
.hero{
  padding:40px 28px 22px;
  position:relative; overflow:hidden;
  border-bottom:1px solid var(--dim);
}

/* top glowing line */
.hero::before{
  content:''; position:absolute;
  top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg,
    transparent, var(--cyan2) 30%,
    var(--cyan) 50%,
    var(--cyan2) 70%, transparent);
  box-shadow:0 0 20px rgba(0,229,255,0.6);
}

.hero-pill{
  display:inline-flex; align-items:center; gap:7px;
  border:1px solid rgba(0,229,255,0.25);
  border-radius:100px; padding:5px 14px;
  margin-bottom:20px;
  background:rgba(0,229,255,0.04);
}
.hero-pill-dot{
  width:6px; height:6px; border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 8px var(--cyan);
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}
.hero-pill-txt{
  font-size:9px; font-weight:600; letter-spacing:2.5px;
  text-transform:uppercase; color:var(--cyan);
}

.hero-name{
  font-family:'Happiness','Outfit',sans-serif;
  font-size:28px; font-weight:normal;
  color:var(--white); line-height:1.05;
  letter-spacing:0.5px;
}

.hero-line{
  width:40px; height:1px;
  background:var(--cyan);
  box-shadow:0 0 8px rgba(0,229,255,0.6);
  margin:12px 0 10px;
}

.hero-role{
  font-size:11px; font-weight:500;
  letter-spacing:3px; text-transform:uppercase;
  color:var(--silver);
}

.hero-company{
  font-size:12px; font-weight:300;
  color:rgba(255,255,255,0.25);
  margin-top:5px; letter-spacing:0.3px;
}

/* ══════════════════
   SECTION DIVIDER
══════════════════ */
.divider{
  display:flex; align-items:center; gap:12px;
  padding:28px 28px 14px;
}
.divider-num{
  font-size:9px; font-weight:700;
  color:var(--cyan); letter-spacing:1px;
  font-family:'Outfit',sans-serif;
  opacity:0.6;
}
.divider-line{
  flex:1; height:1px;
  background:linear-gradient(90deg, var(--dim), transparent);
}
.divider-label{
  font-size:8px; font-weight:600; letter-spacing:3px;
  text-transform:uppercase; color:rgba(255,255,255,0.2);
}

/* ══════════════════
   MSG GRID
══════════════════ */
.msg-grid{
  display:grid; grid-template-columns:1fr 1fr;
  gap:10px; padding:0 20px;
}

.msg-btn{
  border-radius:16px; padding:22px 12px 18px;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  text-decoration:none; cursor:pointer;
  border:1px solid var(--dim);
  background:var(--bg2);
  position:relative; overflow:hidden;
  transition:all 0.22s cubic-bezier(0.16,1,0.3,1);
}

/* glowing top edge on hover */
.msg-btn::before{
  content:''; position:absolute;
  top:0; left:10%; right:10%; height:1px;
  background:var(--cyan);
  box-shadow:0 0 12px var(--cyan);
  opacity:0; transition:opacity 0.25s;
  border-radius:0 0 4px 4px;
}

.msg-btn:active{transform:scale(0.93);}
@media(hover:hover){
  .msg-btn:hover{
    border-color:rgba(0,229,255,0.35);
    background:var(--bg3);
    transform:translateY(-3px);
    box-shadow:0 12px 36px rgba(0,0,0,0.5), 0 0 24px rgba(0,229,255,0.06);
  }
  .msg-btn:hover::before{opacity:1;}
}

.msg-btn-icon{
  width:48px; height:48px; border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,229,255,0.06);
  border:1px solid rgba(0,229,255,0.12);
}
.msg-btn-icon svg{width:24px; height:24px;}

.msg-btn-label{
  font-size:10px; font-weight:700;
  letter-spacing:2px; text-transform:uppercase;
  color:var(--white);
}

.msg-btn-sub{
  font-size:9px; font-weight:300;
  color:var(--silver); letter-spacing:0.5px;
}

/* ══════════════════
   ACTION CARDS
══════════════════ */
.cards{
  display:flex; flex-direction:column; gap:8px;
  padding:0 20px;
}

.card{
  background:var(--bg2);
  border:1px solid var(--dim);
  border-radius:16px; overflow:hidden;
  position:relative;
  transition:all 0.22s cubic-bezier(0.16,1,0.3,1);
}

/* left cyan bar */
.card::before{
  content:''; position:absolute;
  left:0; top:50%; transform:translateY(-50%);
  width:2px; height:40%;
  background:var(--cyan);
  border-radius:0 2px 2px 0;
  box-shadow:0 0 8px rgba(0,229,255,0.7);
  opacity:0.5; transition:opacity 0.22s, height 0.22s;
}

@media(hover:hover){
  .card:hover{
    border-color:rgba(0,229,255,0.2);
    background:var(--bg3);
    transform:translateX(2px);
    box-shadow:0 4px 24px rgba(0,0,0,0.4);
  }
  .card:hover::before{opacity:1; height:60%;}
  .card:hover .card-arr{opacity:1; transform:translateX(4px);}
}
.card:active{transform:scale(0.99);}

.card-head{
  padding:11px 18px 0 20px;
  display:flex; align-items:center; gap:8px;
}
.card-emoji{font-size:12px;}
.card-label{
  font-size:8px; font-weight:700; letter-spacing:2.5px;
  text-transform:uppercase; color:var(--cyan2);
  opacity:0.7;
}

.card-body{
  display:flex; align-items:flex-start; gap:12px;
  padding:9px 18px 16px 20px;
}

.card-icon{
  width:36px; height:36px; border-radius:10px;
  flex-shrink:0; margin-top:2px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,229,255,0.05);
  border:1px solid rgba(0,229,255,0.1);
}
.card-icon svg{
  width:15px; height:15px; stroke:var(--cyan2); fill:none;
  stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
  filter:drop-shadow(0 0 3px rgba(0,229,255,0.4));
}

.card-entries{flex:1; display:flex; flex-direction:column; gap:7px;}

/* entry row */
.entry{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px;
  background:rgba(255,255,255,0.025);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:10px;
  text-decoration:none;
  color:rgba(255,255,255,0.8);
  font-size:12.5px; font-weight:300; letter-spacing:0.2px;
  transition:all 0.18s cubic-bezier(0.16,1,0.3,1);
  position:relative; overflow:hidden;
}

/* shows clearly it is clickable — left accent flash */
.entry::before{
  content:''; position:absolute;
  left:0; top:0; bottom:0; width:0;
  background:rgba(0,229,255,0.08);
  transition:width 0.2s;
  border-radius:inherit;
}

.entry:active{transform:scale(0.97); border-color:rgba(0,229,255,0.3);}
@media(hover:hover){
  .entry:hover{
    border-color:rgba(0,229,255,0.2);
    color:var(--white);
    transform:translateX(3px);
  }
  .entry:hover::before{width:100%;}
  .entry:hover .entry-arr{opacity:1; transform:translateX(2px);}
}

.entry-txt{
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  max-width:85%; position:relative; z-index:1;
}
.entry-arr{
  opacity:0.2; transition:opacity 0.18s, transform 0.18s;
  flex-shrink:0; position:relative; z-index:1;
}
.entry-arr svg{
  width:12px; height:12px; stroke:var(--cyan);
  fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round;
}

/* single row card */
.card-single{
  display:flex; align-items:center; gap:12px;
  padding:9px 18px 16px 20px;
  text-decoration:none; color:rgba(255,255,255,0.8);
  transition:all 0.18s cubic-bezier(0.16,1,0.3,1);
}
.card-single:active{transform:scale(0.99);}
@media(hover:hover){
  .card-single:hover{color:var(--white);}
  .card-single:hover .card-arr{opacity:1; transform:translateX(4px);}
}
.card-single-val{
  flex:1; font-size:13px; font-weight:300;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  letter-spacing:0.2px;
}
.card-arr{
  width:24px; height:24px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,229,255,0.05);
  border:1px solid rgba(0,229,255,0.1);
  opacity:0.3; transition:opacity 0.2s, transform 0.2s;
}
.card-arr svg{
  width:10px; height:10px; stroke:var(--cyan);
  fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round;
}

/* ══════════════════
   SAVE BUTTON
══════════════════ */
.save-wrap{display:none;}

.save-btn{
  display:flex; align-items:center; justify-content:center;
  background:var(--cyan);
  border:none; border-radius:50%;
  color:var(--bg);
  cursor:pointer; text-decoration:none;
  position:fixed;
  bottom:24px; right:24px;
  width:58px; height:58px;
  z-index:999;
  transition:all 0.22s cubic-bezier(0.16,1,0.3,1);
  box-shadow:0 0 0 1px rgba(0,229,255,0.4), 0 8px 32px rgba(0,229,255,0.3), 0 4px 16px rgba(0,0,0,0.5);
  overflow:hidden;
}

/* shine */
.save-btn::before{
  content:''; position:absolute;
  top:-50%; left:-80%; width:50%; height:200%;
  background:linear-gradient(105deg, transparent, rgba(255,255,255,0.25), transparent);
  transform:skewX(-20deg);
  animation:shine 5s ease-in-out infinite 2s;
}
@keyframes shine{0%{left:-80%;}30%{left:150%;}100%{left:150%;}}

.save-btn:active{transform:scale(0.97);}
@media(hover:hover){
  .save-btn:hover{
    transform:scale(1.1);
    box-shadow:0 0 0 1px rgba(0,229,255,0.6), 0 12px 40px rgba(0,229,255,0.4), 0 4px 16px rgba(0,0,0,0.5);
    background:var(--white);
  }
}
/* pulse ring around fixed button */
.save-btn::after{
  content:''; position:absolute; inset:-4px;
  border-radius:50%; border:1px solid rgba(0,229,255,0.3);
  animation:ring 2.5s ease-out infinite;
  pointer-events:none;
}
@keyframes ring{
  0%  {transform:scale(1); opacity:0.6;}
  100%{transform:scale(1.5); opacity:0;}
}

.save-btn svg{
  width:24px; height:24px; stroke:var(--bg);
  fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;
  position:relative; z-index:1;
}
.save-btn-txt{display:none;}

/* footer */
.footer{
  text-align:center; padding:28px 20px 0;
  font-size:9px; font-weight:300; letter-spacing:2px;
  color:rgba(255,255,255,0.08); text-transform:uppercase;
}

#loading{
  min-height:100vh; display:flex; align-items:center;
  justify-content:center; flex-direction:column; gap:14px;
}
.spin{
  width:32px; height:32px; border-radius:50%;
  border:1px solid rgba(0,229,255,0.15);
  border-top-color:var(--cyan);
  animation:sp 1s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg);}}
.spin-txt{font-size:9px; letter-spacing:3px; text-transform:uppercase; color:rgba(0,229,255,0.3);}

/* ── FIXED SAVE BUTTON ── */
.save-fixed {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%; max-width: 440px;
  padding: 12px 20px 20px;
  background: linear-gradient(to top, rgba(3,8,16,1) 60%, rgba(3,8,16,0) 100%);
  z-index: 100;
  display: flex; justify-content: center;
}

.save-fixed-btn {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--cyan);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  text-decoration: none;
  position: relative; overflow: hidden;
  box-shadow:
    0 0 0 1px rgba(0,229,255,0.3),
    0 8px 32px rgba(0,229,255,0.3),
    0 16px 48px rgba(0,0,0,0.5);
  transition: all 0.22s cubic-bezier(0.16,1,0.3,1);
  animation: saveFloat 3s ease-in-out infinite;
}

@keyframes saveFloat {
  0%,100% { box-shadow: 0 0 0 1px rgba(0,229,255,0.3), 0 8px 32px rgba(0,229,255,0.3), 0 16px 48px rgba(0,0,0,0.5); }
  50%      { box-shadow: 0 0 0 4px rgba(0,229,255,0.1), 0 12px 40px rgba(0,229,255,0.45), 0 20px 56px rgba(0,0,0,0.5); }
}

.save-fixed-btn:active { transform: scale(0.92); }
@media(hover:hover){ .save-fixed-btn:hover { transform: scale(1.08); background: var(--white); } }

.save-fixed-btn svg {
  width: 20px; height: 20px; stroke: var(--bg);
  fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
  position: relative; z-index: 1;
}

.save-fixed-tooltip {
  position: absolute;
  bottom: 100%; left: 50%; transform: translateX(-50%);
  background: rgba(0,229,255,0.12);
  border: 1px solid rgba(0,229,255,0.2);
  color: var(--cyan);
  font-size: 8px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 5px 10px; border-radius: 6px;
  white-space: nowrap; margin-bottom: 8px;
  opacity: 0; transition: opacity 0.2s;
  pointer-events: none;
}
.save-fixed-btn:hover .save-fixed-tooltip { opacity: 1; }

/* push page content up so it doesnt hide behind fixed button */
.page { padding-bottom: 90px !important; }

</style>
</head>
<body>

<div class="page" id="root">
  <div id="loading">
    <div class="spin"></div>
    <div class="spin-txt">Loading</div>
  </div>
</div>

<script>
const WA = "25377481141";
const TG = "Mramir_58";

async function init(){
  const root = document.getElementById('root');
  let c;
  try{
    const r = await fetch('./contact.json?v='+Date.now());
    c = await r.json();
  }catch(e){
    root.innerHTML='<div id="loading"><div class="spin-txt" style="color:rgba(244,63,94,0.5)">Failed to load</div></div>';
    return;
  }

  const phones = c.phones.map(p=>`
    <a class="entry" href="tel:${p.replace(/\s/g,'')}">
      <span class="entry-txt">${p}</span>
      <span class="entry-arr"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
    </a>`).join('');

  const emails = c.emails.map(e=>`
    <a class="entry" href="mailto:${e}">
      <span class="entry-txt">${e}</span>
      <span class="entry-arr"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></span>
    </a>`).join('');

  const vcf=['BEGIN:VCARD','VERSION:3.0',
    `FN:${c.name}`,`TITLE:${c.title}`,`ORG:${c.company}`,
    ...c.phones.map(p=>`TEL;TYPE=CELL:${p.replace(/\s/g,'')}`),
    ...c.emails.map((e,i)=>`EMAIL;TYPE=${i===0?'WORK':'HOME'}:${e}`),
    `URL:${c.website}`,`ADR;TYPE=WORK:;;${c.company};${c.location.label};;;`,
    `GEO:geo:${c.location.geo}`,'END:VCARD'].join('\r\n');

  root.innerHTML=`

    <!-- HERO -->
    <div class="hero">
      <div class="hero-pill">
        <div class="hero-pill-dot"></div>
        <span class="hero-pill-txt">Digital Business Card</span>
      </div>
      <div class="hero-name">${c.name}</div>
      <div class="hero-line"></div>
      <div class="hero-role">${c.title}</div>
      <div class="hero-company">${c.company}</div>
    </div>

    <!-- 01 MESSAGE -->
    <div class="divider">
      <div class="divider-num">01</div>
      <div class="divider-line"></div>
      <div class="divider-label">Message</div>
    </div>

    <div class="msg-grid">
      <a class="msg-btn" href="https://wa.me/${WA}" target="_blank">
        <div class="msg-btn-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M20.52 3.48A11.93 11.93 0 0 0 12 0C5.37 0 0 5.37 0 12c0 2.11.55 4.17 1.6 5.99L0 24l6.18-1.62A11.94 11.94 0 0 0 12 24c6.63 0 12-5.37 12-12 0-3.21-1.25-6.22-3.48-8.52zM12 22c-1.85 0-3.66-.5-5.23-1.44l-.37-.22-3.87 1.01 1.04-3.76-.24-.38A9.94 9.94 0 0 1 2 12C2 6.48 6.48 2 12 2c2.67 0 5.18 1.04 7.07 2.93A9.93 9.93 0 0 1 22 12c0 5.52-4.48 10-10 10zm5.47-7.4c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51l-.57-.01c-.2 0-.52.07-.79.37-.27.3-1.04 1.01-1.04 2.47s1.06 2.87 1.21 3.07c.15.2 2.09 3.19 5.07 4.47.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35z" fill="currentColor" style="color:#00e5ff"/></svg>
        </div>
        <div class="msg-btn-label">WhatsApp</div>
        <div class="msg-btn-sub">Chat now</div>
      </a>
      <a class="msg-btn" href="https://t.me/${TG}" target="_blank">
        <div class="msg-btn-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L7.88 13.967l-2.967-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.834.93l-.539.662z" fill="currentColor" style="color:#00e5ff"/></svg>
        </div>
        <div class="msg-btn-label">Telegram</div>
        <div class="msg-btn-sub">@${TG}</div>
      </a>
    </div>

    <!-- 02 CONTACT -->
    <div class="divider">
      <div class="divider-num">02</div>
      <div class="divider-line"></div>
      <div class="divider-label">Contact</div>
    </div>

    <div class="cards">

      <div class="card">
        <div class="card-head"><span class="card-emoji">📞</span><span class="card-label">Phone</span></div>
        <div class="card-body">
          <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.8a19.79 19.79 0 01-3.07-8.7A2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg></div>
          <div class="card-entries">${phones}</div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-emoji">✉️</span><span class="card-label">Email</span></div>
        <div class="card-body">
          <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
          <div class="card-entries">${emails}</div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-emoji">🌐</span><span class="card-label">Website</span></div>
        <a class="card-single" href="${c.website}" target="_blank">
          <div class="card-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg></div>
          <span class="card-single-val">${c.website.replace('https://','')}</span>
          <div class="card-arr"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
        </a>
      </div>

      <div class="card">
        <div class="card-head"><span class="card-emoji">📍</span><span class="card-label">Location</span></div>
        <a class="card-single" href="${c.location.maps_url}" target="_blank">
          <div class="card-icon"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg></div>
          <span class="card-single-val">${c.location.label}</span>
          <div class="card-arr"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
        </a>
      </div>

    </div>

    <!-- 03 SAVE -->
    <div class="divider">
      <div class="divider-num">03</div>
      <div class="divider-line"></div>
      <div class="divider-label">Save</div>
    </div>

    <div class="save-wrap">
      <a class="save-btn" id="saveBtn" href="#" title="Save Contact to Phone">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="save-btn-txt">Save Contact to Phone</span>
      </a>
    </div>

    <div class="footer">Twingulf Industries · Digital Card</div>
  `;

  document.title=`${c.name} — ${c.company}`;

  // inject fixed save button
  const fixedBtn = document.createElement('div');
  fixedBtn.className = 'save-fixed';
  fixedBtn.innerHTML = `
